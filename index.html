<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple, precise metronome with adjustable tempo and time signature."
    />
    <meta name="theme-color" content="#0e0d14" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="48x48" />
    <link rel="icon" href="%BASE_URL%favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon-180x180.png" />
    <title>Metronome</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash. Keep the key
      // in sync with THEME_STORAGE_KEY in src/hooks/useTheme.ts.
      try {
        if (JSON.parse(localStorage.getItem('metronome.theme')) === 'light') {
          document.documentElement.dataset.theme = 'light';
          document.querySelector('meta[name="theme-color"]').content = '#f3f2f8';
        }
      } catch {
        // Ignore: stay on the default dark theme.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
